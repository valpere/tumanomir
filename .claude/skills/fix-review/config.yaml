# fix-review config for tumanomir (valpere/tumanomir)
# Generated by /generate-fix-review on 2026-07-03.
# Provider: Ollama cloud primary (OLLAMA_API_KEY present in .env) + local failover
# (ollama serve is up locally, v0.30.11).

provider: ollama

reviewers:
  # Primary — Ollama cloud (recommended roster; all three confirmed present via `ollama list`)
  ollama:
    round_1: { model: glm-5.1:cloud }
    round_2: { model: deepseek-v4-flash:cloud }
    round_3: { model: kimi-k2.6:cloud }

  # Tier 2 — external agent CLIs (own free-tier subscriptions/logins,
  # entirely independent of Ollama's quota). Tried in this order per round;
  # first one that returns a non-empty result wins. This is a pool that
  # backs itself up — any single tool's free tier can run dry, so having
  # several matters more than picking "the best one". See lib/agents.sh
  # for the adapters.
  external_agents:
    - { tool: cursor-agent, model: auto }
    - { tool: omp }
    - { tool: codex }
    - { tool: opencode, model: "opencode/nemotron-3-ultra-free" }
    - { tool: kilo }

  # Tier 3 — Ollama local (повністю офлайн, без ключа). Last resort — slow
  # on this machine, only reached if both cloud and every external agent
  # above failed.
  ollama_local:
    round_1: { model: granite3.3:8b }
    round_2: { model: qwen2.5-coder:7b }
    round_3: { model: gemma4:31b }

ollama_api_url: http://localhost:11434/api/chat

arbiter: claude

diff_scope: delta

# AUTO_MERGE disabled: this project also runs /ship, which owns the merge step
# (STEP 3 of ship/SKILL.md). fix-review must not merge — see SKILL.md STEP 10.
auto_merge: false

post_summary_to_pr: true

telemetry_enabled: true
telemetry_file: .claude/skills/fix-review/telemetry.jsonl

# Pricing per 1M tokens (USD) — Ollama cloud/local are free. External-agent
# rows are keyed by tool name, not model — also free (own subscriptions),
# listed for telemetry completeness.
pricing:
  "glm-5.1:cloud":           { input: 0.00, output: 0.00 }
  "deepseek-v4-flash:cloud": { input: 0.00, output: 0.00 }
  "kimi-k2.6:cloud":         { input: 0.00, output: 0.00 }
